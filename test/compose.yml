# End-to-end overlay for compose.yml (run with test/e2e.sh): the real stack on
# fixture shows/music, with shows/music/logs/covers/plays/archive in throwaway volumes
# (shows and music so e2e.sh can change them, as a deploy does), nothing
# published to the host, and a Playwright container driving it.
services:
  # Seeds the shows, music and covers volumes from the fixtures, before init
  # sets their owners as in production; once, as test/e2e.sh's deploys run it
  # again (`up` starts init and so this). e2e.sh also runs it to change shows
  # and music.
  seed:
    image: busybox:1.38.0
    command:
      - sh
      - -c
      - |
        [ -e /music/.seeded ] && exit
        cp -r /fixture-shows/. /shows/ && cp -r /fixture-music/. /music/ && cp -r /fixture-covers/. /covers/
        # Two finished archive blocks of the night show (14 s each, untagged)
        # with their track sidecars, for the archive tests.
        mkdir -p /archive && cp -r /fixture-archive/. /archive/
        chmod -R a+rX /shows /music /archive
        touch /music/.seeded
    volumes:
      - e2e-shows:/shows
      - e2e-music:/music
      - e2e-covers:/covers
      - e2e-archive:/archive
      - ./test/fixtures/shows:/fixture-shows:ro
      - ./test/fixtures/music:/fixture-music:ro
      - ./test/fixtures/covers:/fixture-covers:ro
      - ./test/fixtures/archive:/fixture-archive:ro
  init:
    volumes:
      - e2e-logs:/logs
      - e2e-covers:/covers
      - e2e-plays:/plays
      - e2e-archive:/archive
    depends_on:
      seed: { condition: service_completed_successfully }
  icecast:
    volumes:
      - e2e-logs:/var/log/icecast
      - e2e-archive:/archive:ro
  liquidsoap:
    # The tests put the show they need on air (radio.liq onair; test/helpers.ts),
    # and shrink the times: the complement's three hours to 30 s, a block's
    # tail to 5 s, and the shortest archived block from five hours to 90 s
    # (over the minute radio.liq takes to see an hours change).
    environment:
      ONAIR_PORT: 7000
      COMPLEMENT_WINDOW: 30
      ARCHIVE_TAIL: 5
      ARCHIVE_MIN_SECONDS: 90
    volumes:
      - e2e-shows:/shows:ro
      - e2e-music:/music:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays
      - e2e-archive:/archive
  app:
    # Two blocks a show, so a block can go on to the one before.
    environment:
      ARCHIVE_KEEP: 2
    volumes:
      - e2e-shows:/shows:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays:ro
      - e2e-archive:/archive:ro
      - e2e-logs:/logs:ro
  archive-prune:
    environment:
      ARCHIVE_KEEP: 2
    volumes:
      - e2e-archive:/archive
  caddy:
    ports: !reset []
    volumes:
      - e2e-logs:/srv/logs
  e2e:
    image: radio-e2e
    build: { context: ., target: e2e }
    # Share Caddy's network namespace so the tests reach it as https://localhost,
    # the same site address (and local-CA certificate) as an unconfigured install.
    network_mode: service:caddy
    environment:
      BASE_URL: https://localhost
      SITE_PASSWORD: ${SITE_PASSWORD}
    volumes:
      - ./test-results:/app/test-results
      - e2e-plays:/plays:ro
      # For the specs to check the reports and the archive against.
      - e2e-logs:/logs:ro
      - e2e-archive:/archive:ro
    depends_on:
      caddy: { condition: service_started }
      liquidsoap: { condition: service_started }

volumes:
  e2e-shows: {}
  e2e-music: {}
  e2e-logs: {}
  e2e-covers: {}
  e2e-plays: {}
  e2e-archive: {}
