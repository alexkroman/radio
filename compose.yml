# ── Security model ────────────────────────────────────────────────────────────
# Every long-running service: no privilege escalation + all Linux capabilities
# dropped. None run as root:
#   - icecast / liquidsoap / ddns keep their image's built-in non-root user
#     (icecast / liquidsoap / curl_user) and join the shared app group (GID
#     10001) so they can reach the shared volumes and bind-mounted dirs.
#   - caddy / goaccess run as a dedicated non-root UID:GID 10001:10001.
# The one-shot `init` service runs as root once at startup to set ownership on
# the named volumes and bind-mounted dirs to the app UID/GID, then exits. It is
# the only root container and holds only the capabilities needed to chown.
# Caddy binds privileged port 443 as non-root via an unprivileged-port sysctl.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  init:
    image: busybox:1.37.0
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 10001:10001 /data /stats /db /logs /covers
        chmod -R u+rwX,g+rwX /logs /covers /stats /db /data
        chmod g+s /logs /covers
    volumes:
      - caddy:/data
      - stats:/stats
      - db:/db
      - ./logs:/logs
      - ./covers:/covers
    restart: "no"

  icecast:
    <<: *hardening
    group_add: ["10001"]
    restart: unless-stopped
    image: libretime/icecast:2.4.4
    command:
      [
        "sh",
        "-c",
        "sed 's|<!-- <playlistlog>playlist.log</playlistlog> -->|<playlistlog>playlist.log</playlistlog>|; s|<logsize>10000</logsize>|<logsize>1000</logsize>|' /etc/icecast.xml > /tmp/icecast.xml && grep -q '^ *<playlistlog>' /tmp/icecast.xml && exec icecast -c /tmp/icecast.xml",
      ]
    environment:
      ICECAST_SOURCE_PASSWORD: &password ${PASSWORD:?Set PASSWORD in .env}
      ICECAST_ADMIN_PASSWORD: *password
      ICECAST_RELAY_PASSWORD: *password
    volumes:
      - ./logs:/var/log/icecast
      - stats:/usr/share/icecast/web/stats
    depends_on:
      init: { condition: service_completed_successfully }

  liquidsoap:
    <<: *hardening
    group_add: ["10001"]
    restart: unless-stopped
    image: savonet/liquidsoap:v2.3.3
    command: ["/radio.liq"]
    ports: ["8005:8005"]
    environment:
      PASSWORD: *password
      LIVE_PASSWORD: ${LIVE_PASSWORD:?Set LIVE_PASSWORD in .env}
    volumes:
      - ./radio.liq:/radio.liq:ro
      - ./music:/music:ro
      - ./covers:/covers
    depends_on:
      init: { condition: service_completed_successfully }
      icecast: { condition: service_started }

  goaccess:
    <<: *hardening
    user: "10001:10001"
    restart: unless-stopped
    image: allinurl/goaccess@sha256:20072eca570093cf6dcadb17856d90d48cd9e8a9e114b8f539c2ebefec99c63e
    command:
      - /logs/caddy-access.log
      - -o
      - /stats/index.html
      - --real-time-html
      - --ws-url=wss://${DOMAIN:-localhost}:443/ws
      - --log-format=CADDY
      - --persist
      - --restore
      - --db-path=/db
      - --ignore-panel=REQUESTS_STATIC
      - --ignore-panel=NOT_FOUND
      - --ignore-panel=REFERRERS
      - --ignore-panel=REFERRING_SITES
      - --ignore-panel=ASN
      - --ignore-panel=UTM_CAMPAIGNS
    volumes:
      - ./logs:/logs:ro
      - stats:/stats
      - db:/db
    depends_on:
      init: { condition: service_completed_successfully }
      caddy: { condition: service_started }

  ddns:
    <<: *hardening
    restart: unless-stopped
    image: curlimages/curl@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint:
      [
        "sh",
        "-c",
        'while true; do curl -fsS "https://dynamicdns.park-your-domain.com/update?host=@&domain=$$DOMAIN&password=$$DDNS_PASSWORD" && echo; sleep 300; done',
      ]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      DDNS_PASSWORD: ${DDNS_PASSWORD:?Set DDNS_PASSWORD in .env}

  caddy:
    <<: *hardening
    user: "10001:10001"
    # Allow the non-root user to bind privileged port 443.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=443
    restart: unless-stopped
    image: caddy:2.11.9
    command:
      [
        "sh",
        "-c",
        'export STATS_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$PASSWORD")" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile',
      ]
    ports: ["443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PASSWORD: *password
      # Keep Caddy's config/data under the writable /data volume (non-root).
      XDG_CONFIG_HOME: /data
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - ./logs:/srv/logs
      - ./covers:/srv/covers:ro
      - caddy:/data
    depends_on:
      init: { condition: service_completed_successfully }
      icecast: { condition: service_started }

volumes:
  caddy: {}
  db: {}
  stats: {}
