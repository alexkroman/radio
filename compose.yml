x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
  start_interval: 5s

# Restarted by Docker if it exits, and by autoheal if its healthcheck fails.
x-watched: &watched
  restart: unless-stopped
  labels: { autoheal: "true" }

services:
  icecast:
    <<: *watched
    image: libretime/icecast:2.4.4
    command:
      [
        "sh",
        "-c",
        "sed 's|<!-- <playlistlog>playlist.log</playlistlog> -->|<playlistlog>playlist.log</playlistlog>|; s|<logsize>10000</logsize>|<logsize>1000</logsize>|' /etc/icecast.xml > /tmp/icecast.xml && grep -q '^ *<playlistlog>' /tmp/icecast.xml && exec icecast -c /tmp/icecast.xml",
      ]
    environment:
      ICECAST_SOURCE_PASSWORD: &password ${PASSWORD:?Set PASSWORD in .env}
      ICECAST_ADMIN_PASSWORD: *password
      ICECAST_RELAY_PASSWORD: *password
    volumes:
      - logs:/var/log/icecast
      - stats:/usr/share/icecast/web/stats
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /status-json.xsl HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 5 cat <&3 | grep -q icestats",
        ]

  liquidsoap:
    <<: *watched
    image: savonet/liquidsoap:v2.3.3
    command: ["/radio.liq"]
    ports: ["${LIVE_PORT:-8005}:8005"]
    environment:
      PASSWORD: *password
      LIVE_PASSWORD: ${LIVE_PASSWORD:?Set LIVE_PASSWORD in .env}
    volumes:
      - ./radio.liq:/radio.liq:ro
      - ./music:/music:ro
    depends_on: [icecast]
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8005 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 5 head -1 <&3 | grep -q HTTP",
        ]

  goaccess:
    <<: *watched
    image: allinurl/goaccess@sha256:20072eca570093cf6dcadb17856d90d48cd9e8a9e114b8f539c2ebefec99c63e
    command:
      - /logs/caddy-access.log
      - -o
      - /stats/index.html
      - --real-time-html
      - --ws-url=wss://${DOMAIN:-localhost}:443/ws
      - --log-format=CADDY
      - --persist
      - --restore
      - --db-path=/db
      - --geoip-database=/geo/city.mmdb
      - --ignore-panel=REQUESTS_STATIC
      - --ignore-panel=NOT_FOUND
      - --ignore-panel=REFERRERS
      - --ignore-panel=REFERRING_SITES
      - --ignore-panel=ASN
      - --ignore-panel=UTM_CAMPAIGNS
    volumes:
      - logs:/logs:ro
      - stats:/stats
      - db:/db
      - geo:/geo:ro
    depends_on:
      caddy: { condition: service_started }
      geoip: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7890"]

  caddy:
    <<: *watched
    image: caddy:2
    command:
      [
        "sh",
        "-c",
        'export STATS_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$PASSWORD")" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile',
      ]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PASSWORD: *password
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - logs:/srv/logs
      - caddy:/data
    depends_on: [icecast]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/"]

  autoheal:
    image: willfarrell/autoheal@sha256:b44413bd16c784a2bb33e410186ce72f44ed39737ec834517458318a78e13dd9
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  geoip:
    image: curlimages/curl@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    user: root
    entrypoint:
      [
        "sh",
        "-c",
        "for m in $$(date +%Y-%m) $$(date -d @$$(($$(date +%s) - 2678400)) +%Y-%m); do curl -fsSL https://download.db-ip.com/free/dbip-city-lite-$$m.mmdb.gz | gunzip > /geo/new.mmdb && mv /geo/new.mmdb /geo/city.mmdb && break; done; test -s /geo/city.mmdb",
      ]
    volumes:
      - geo:/geo

volumes:
  caddy: {}
  geo: {}
  db: {}
  logs: {}
  stats: {}
