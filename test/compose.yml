# End-to-end overlay for compose.yml (run with test/e2e.sh): the real stack on
# fixture shows/music, with shows/music/logs/covers/plays in throwaway volumes
# (shows and music so e2e.sh can change them, as a deploy does), nothing
# published to the host, and a Playwright container driving it.
services:
  # Seeds the shows, music and covers volumes from the fixtures, before init
  # sets their owners as in production; once, as test/e2e.sh's deploys run it
  # again (`up` starts init and so this). e2e.sh also runs it to change shows
  # and music.
  seed:
    image: busybox:1.38.0
    command:
      - sh
      - -c
      - |
        [ -e /music/.seeded ] && exit
        cp -r /fixture-shows/. /shows/ && cp -r /fixture-music/. /music/ && cp -r /fixture-covers/. /covers/
        chmod -R a+rX /shows /music
        touch /music/.seeded
    volumes:
      - e2e-shows:/shows
      - e2e-music:/music
      - e2e-covers:/covers
      - ./test/fixtures/shows:/fixture-shows:ro
      - ./test/fixtures/music:/fixture-music:ro
      - ./test/fixtures/covers:/fixture-covers:ro
  init:
    volumes:
      - e2e-logs:/logs
      - e2e-covers:/covers
      - e2e-plays:/plays
    depends_on:
      seed: { condition: service_completed_successfully }
  icecast:
    volumes:
      - e2e-logs:/var/log/icecast
  liquidsoap:
    # The tests put the show they need on air (radio.liq onair; test/helpers.ts).
    environment:
      ONAIR_PORT: 7000
    volumes:
      - e2e-shows:/shows:ro
      - e2e-music:/music:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays
  app:
    volumes:
      - e2e-shows:/shows:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays:ro
  caddy:
    ports: !reset []
    volumes:
      - e2e-logs:/srv/logs
  e2e:
    image: radio-e2e
    build: { context: ., target: e2e }
    # Share Caddy's network namespace so the tests reach it as https://localhost,
    # the same site address (and local-CA certificate) as an unconfigured install.
    network_mode: service:caddy
    environment:
      BASE_URL: https://localhost
      SITE_PASSWORD: ${SITE_PASSWORD}
    volumes:
      - ./test-results:/app/test-results
      - e2e-plays:/plays:ro
    depends_on:
      caddy: { condition: service_started }
      liquidsoap: { condition: service_started }

volumes:
  e2e-shows: {}
  e2e-music: {}
  e2e-logs: {}
  e2e-covers: {}
  e2e-plays: {}
