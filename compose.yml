# ── Security model ────────────────────────────────────────────────────────────
# Every long-running service: no privilege escalation + all Linux capabilities
# dropped. None run as root:
#   - icecast / liquidsoap keep their image's built-in non-root user and
#     join the shared app group (GID 10001) so they can reach the bind mounts.
#   - app (Node, built from ./Dockerfile) runs as the image's `node` user.
#   - caddy runs as a dedicated non-root UID:GID 10001:10001.
# Only Caddy (443) is published; the app and the Icecast streams are reachable
# only through Caddy.
# The one-shot `init` service runs as root once at startup to set ownership on
# the named volume and bind-mounted dirs to the app UID/GID, then exits. It is
# the only root container and holds only the capabilities needed to chown.
# Caddy binds privileged port 443 as non-root via an unprivileged-port sysctl.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  init:
    image: busybox:1.38.0
    <<: *hardening
    user: "0:0"
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 10001:10001 /data /logs /covers /plays
        chmod -R u+rwX,g+rwX /logs /covers /plays /data
        chmod g+s /logs /covers /plays
    volumes:
      - caddy:/data
      - ./logs:/logs
      - ./covers:/covers
      - ./plays:/plays
    restart: "no"

  # Serves the streams (one mount per show), with UTF-8 track metadata.
  # Buffering for slow connections (the streams are 256 kbps, 32 KB/s):
  #   - burst-size: a new listener gets ~10 s of audio at once (default 64 KB,
  #     ~2 s), so the player starts with a full buffer instead of an empty one.
  #   - queue-size: a listener whose connection stalls can fall ~32 s behind
  #     before Icecast drops it (default 512 KB, ~16 s). Must exceed burst-size.
  # Keeping listeners through a Liquidsoap restart (as AzuraCast does): while a
  # show's source is gone its listeners get icecast/silence.mp3 (looped; same
  # 256 kbps MP3 format), and fallback-override moves them back when it returns,
  # so players stay connected instead of dropping. Icecast 2.5 ignores fallbacks
  # on the default mount, so each show in shows/ gets its own <mount> at startup
  # (a show added later streams without a fallback until Icecast restarts), and
  # its own copy of the file: listeners on a shared fallback would all go back
  # to whichever show returned first.
  icecast:
    <<: *hardening
    group_add: ["10001"]
    restart: unless-stopped
    image: libretime/icecast:2.5.0
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /tmp/web
        cp -R /usr/share/icecast/web/. /tmp/web/
        mounts=
        for f in /shows/*.md; do
          [ -e "$$f" ] || continue
          slug=$$(basename "$$f" .md)
          cp /silence.mp3 "/tmp/web/fallback-$$slug.mp3"
          mounts="$$mounts<mount type=\"normal\"><mount-name>/$$slug</mount-name><fallback-mount>/fallback-$$slug.mp3</fallback-mount><fallback-override>1</fallback-override></mount>"
        done
        sed \
          -e "s|<hostname>localhost</hostname>|<hostname>$$DOMAIN</hostname>|" \
          -e 's|<errorlog>-</errorlog>|<errorlog>error.log</errorlog>|' \
          -e 's|<webroot>[^<]*</webroot>|<webroot>/tmp/web</webroot>|' \
          -e "s|</icecast>|<mount type=\"default\"><charset>UTF-8</charset></mount>$$mounts</icecast>|" \
          -e 's|<burst-size>[0-9]*</burst-size>|<burst-size>327680</burst-size>|' \
          -e 's|<queue-size>[0-9]*</queue-size>|<queue-size>1048576</queue-size>|' \
          /etc/icecast.xml > /tmp/icecast.xml
        chmod 600 /tmp/icecast.xml
        grep -q '<charset>UTF-8' /tmp/icecast.xml
        grep -q '<burst-size>327680<' /tmp/icecast.xml
        grep -q '<queue-size>1048576<' /tmp/icecast.xml
        grep -q '<webroot>/tmp/web<' /tmp/icecast.xml
        exec icecast -c /tmp/icecast.xml
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ICECAST_SOURCE_PASSWORD: &password ${PASSWORD:?Set PASSWORD in .env}
      ICECAST_ADMIN_PASSWORD: *password
      ICECAST_RELAY_PASSWORD: *password
      # One source per show (the image's default is 2).
      ICECAST_MAX_SOURCES: 100
      # Every connection across all mounts (listeners, sources, Liquidsoap's
      # status checks); the image's default is 100. Each listener takes 256
      # kbps of upload, so set this to what the connection can carry.
      ICECAST_MAX_CLIENTS: ${MAX_LISTENERS:-100}
    volumes:
      - ./logs:/var/log/icecast
      - ./shows:/shows:ro
      - ./icecast/silence.mp3:/silence.mp3:ro
    depends_on:
      init: { condition: service_completed_successfully }

  # One 24/7 stream per show (radio.liq), sent to Icecast; writes the play log
  # (plays/YYYY-MM.jsonl).
  liquidsoap:
    <<: *hardening
    group_add: ["10001"]
    restart: unless-stopped
    image: savonet/liquidsoap:v2.4.6
    command: ["/radio.liq"]
    environment:
      TZ: ${TZ:-UTC}
      PASSWORD: *password
    volumes:
      - ./radio.liq:/radio.liq:ro
      - ./shows:/shows:ro
      - ./music:/music:ro
      - ./covers:/covers:ro
      - ./plays:/plays
    depends_on:
      init: { condition: service_completed_successfully }
      icecast: { condition: service_started }

  # Show list, player pages and /admin (app/).
  app:
    <<: *hardening
    group_add: ["10001"]
    restart: unless-stopped
    image: radio-app
    pull_policy: build
    build: { context: ., target: app }
    environment:
      TZ: ${TZ:-UTC}
      SITE_TITLE: ${SITE_TITLE:-Mazes Radio}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    volumes:
      - ./shows:/shows:ro
      - ./covers:/covers:ro
      - ./plays:/plays:ro
    depends_on:
      init: { condition: service_completed_successfully }

  caddy:
    <<: *hardening
    user: "10001:10001"
    # Allow the non-root user to bind ports 80 and 443.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=80
    restart: unless-stopped
    image: caddy:2.11.9
    ports: ["443:443", "80:80"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Keep Caddy's config/data under the writable /data volume (non-root).
      XDG_CONFIG_HOME: /data
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs:/srv/logs
      - caddy:/data
    depends_on:
      init: { condition: service_completed_successfully }
      icecast: { condition: service_started }
      app: { condition: service_started }

volumes:
  caddy: {}
