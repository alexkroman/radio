# ── Security model ────────────────────────────────────────────────────────────
# Every long-running service: no privilege escalation + all Linux capabilities
# dropped. None run as root:
#   - icecast / liquidsoap keep their image's built-in non-root user and
#     join the shared app group (GID 10001) so they can reach the bind mounts.
#   - app (Node, built from ./Dockerfile) runs as the image's `node` user.
#   - caddy runs as a dedicated non-root UID:GID 10001:10001.
# Only Caddy (443) is published; the app and the Icecast streams are reachable
# only through Caddy.
# The one-shot `init` service runs as root once at startup to set ownership on
# the named volume and bind-mounted dirs to the app UID/GID, then exits. It is
# the only root container and holds only the capabilities needed to chown.
# Caddy binds privileged port 443 as non-root via an unprivileged-port sysctl.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Docker keeps each container's console log forever unless told otherwise:
# cap it at 3 files of 10 MB, rotated. (Icecast's and Caddy's own log files
# under logs/ rotate themselves.)
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  init:
    image: busybox:1.38.0
    <<: [*hardening, *logging]
    user: "0:0"
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /archive/recording /archive/blocks /archive/short /archive/tracks
        chown -R 10001:10001 /data /logs /covers /plays /archive
        chmod -R u+rwX,g+rwX /logs /covers /plays /data /archive
        chmod g+s /logs /covers /plays /archive /archive/recording /archive/blocks /archive/short /archive/tracks
    volumes:
      - caddy:/data
      - ./logs:/logs
      - ./covers:/covers
      - ./plays:/plays
      - ./archive:/archive
    restart: "no"

  # Serves the streams (mounts /stream and /stream/<show>), with UTF-8 track
  # metadata, extra buffering for slow connections and a silent fallback so listeners stay
  # connected through a Liquidsoap restart: see icecast/config.sh, which also
  # reloads the config without dropping anyone.
  icecast:
    <<: [*hardening, *logging]
    group_add: ["10001"]
    restart: unless-stopped
    image: libretime/icecast:2.5.0
    command: ["sh", "-c", "sh /icecast/config.sh && exec icecast -c /tmp/icecast.xml"]
    environment:
      # Its logs' times.
      TZ: ${TZ:-America/Los_Angeles}
      DOMAIN: ${DOMAIN:-localhost}
      ICECAST_SOURCE_PASSWORD: &password ${PASSWORD:?Set PASSWORD in .env}
      ICECAST_ADMIN_PASSWORD: *password
      ICECAST_RELAY_PASSWORD: *password
      # The Liquidsoap sources (the station and a channel per show), with room
      # for each one's silence fallback and for a restarting Liquidsoap whose
      # old connections linger (the image's default is 2): enough for 10
      # shows. Icecast logs an error at start unless the client limit below is
      # more than twice this ("Client limit (200) is too small for given source
      # limit (100)"), so keep MAX_LISTENERS over 80.
      ICECAST_MAX_SOURCES: 40
      # Shown on Icecast's status pages (not public: Caddy only exposes the
      # streams). Unset, Icecast warns at every start.
      ICECAST_ADMIN_EMAIL: admin@${DOMAIN:-localhost}
      ICECAST_LOCATION: ${DOMAIN:-localhost}
      # Every connection across all mounts (listeners, sources, Liquidsoap's
      # status checks); the image's default is 100. Each listener takes 256
      # kbps of upload, so set this to what the connection can carry.
      ICECAST_MAX_CLIENTS: ${MAX_LISTENERS:-100}
    volumes:
      - ./logs:/var/log/icecast
      - ./icecast:/icecast:ro
      # The shows, for their streams' mounts (icecast/config.sh).
      - ./shows:/shows:ro
    depends_on:
      init: { condition: service_completed_successfully }

  # The 24/7 stream, playing the shows on their schedule (radio.liq), and each
  # show's own stream, looping its archived blocks, sent to Icecast; writes
  # the play logs (plays/YYYY-MM.jsonl, and plays/YYYY-MM.<show>.jsonl for the
  # shows' streams) and records each show block to archive/. TZ is the
  # schedule's time zone (.env).
  liquidsoap:
    <<: [*hardening, *logging]
    group_add: ["10001"]
    restart: unless-stopped
    image: savonet/liquidsoap:v2.4.6
    command: ["/radio.liq"]
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      PASSWORD: *password
    volumes:
      - ./radio.liq:/radio.liq:ro
      - ./shows:/shows:ro
      - ./music:/music:ro
      - ./covers:/covers:ro
      - ./plays:/plays
      - ./archive:/archive
    depends_on:
      init: { condition: service_completed_successfully }
      icecast: { condition: service_started }

  # Show list, player pages and reports (app/).
  app:
    <<: [*hardening, *logging]
    group_add: ["10001"]
    restart: unless-stopped
    image: radio-app
    pull_policy: build
    build: { context: ., target: app }
    # Node as PID 1 ignores SIGTERM, so each stop waited Docker's 10 s before
    # a SIGKILL; with an init process it exits at once.
    init: true
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      SITE_TITLE: ${SITE_TITLE:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    volumes:
      - ./shows:/shows:ro
      - ./covers:/covers:ro
      - ./plays:/plays:ro
      # Which shows have archived blocks, so a play button for each one's own
      # stream (app/archive.ts).
      - ./archive:/archive:ro
    depends_on:
      init: { condition: service_completed_successfully }

  # Deletes archive blocks before they've been up two weeks, all but the
  # newest ARCHIVE_KEEP of each show, and blocks too short to archive
  # (scripts/prune-archive.sh): at start, then every hour (nightly included),
  # so a finished block's predecessor goes within the hour.
  archive-prune:
    <<: [*hardening, *logging]
    user: "10001:10001"
    restart: unless-stopped
    image: busybox:1.38.0
    command: ["sh", "-c", "while :; do sh /prune-archive.sh; sleep 3600; done"]
    environment:
      ARCHIVE_KEEP: ${ARCHIVE_KEEP:-1}
    volumes:
      - ./scripts/prune-archive.sh:/prune-archive.sh:ro
      - ./archive:/archive
    depends_on:
      init: { condition: service_completed_successfully }

  caddy:
    <<: [*hardening, *logging]
    user: "10001:10001"
    # Allow the non-root user to bind ports 80 and 443.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=80
    restart: unless-stopped
    image: caddy:2.11.9
    ports: ["443:443", "80:80"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Keep Caddy's config/data under the writable /data volume (non-root).
      XDG_CONFIG_HOME: /data
    volumes:
      # The directory, not the file: rsync (deploy.sh) replaces a file with a new
      # one, which a single-file bind mount never sees, so `caddy reload` would
      # keep reading the old config.
      - ./caddy:/etc/caddy:ro
      - ./logs:/srv/logs
      - caddy:/data
    depends_on:
      init: { condition: service_completed_successfully }
      icecast: { condition: service_started }
      app: { condition: service_started }

volumes:
  caddy: {}
