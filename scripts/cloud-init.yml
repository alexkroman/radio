#cloud-config
# First boot of the OVHcloud server (scripts/deploy.sh): Docker from Ubuntu's
# own packages (the image already has rsync and unattended-upgrades).
package_update: true
packages: [docker.io, docker-compose-v2, docker-buildx]
# SSH keys only: bots try thousands of passwords a day.
ssh_pwauth: false
write_files:
  # Read before cloud-init's and the image's own sshd_config.d files, so these
  # win (sshd keeps the first value it sees).
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      PermitRootLogin no
      AllowAgentForwarding no
      MaxAuthTries 3
      LoginGraceTime 20
  # Reboot after security updates that need it (kernel, libc), at 11:00 UTC
  # (3-4 am Pacific). Docker restarts the station afterwards.
  - path: /etc/apt/apt.conf.d/52unattended-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "11:00";
  # Keep containers (and the streams) running while Docker itself restarts,
  # e.g. after a docker.io update; without it, every listener is dropped.
  - path: /etc/docker/daemon.json
    content: |
      {"live-restore": true}
runcmd:
  # Group 10001 owns the data dirs (compose.yml's init service), so rsync can
  # update covers/.
  - groupadd -g 10001 radio
  - usermod -aG docker,radio ubuntu
