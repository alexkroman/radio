# End-to-end overlay for compose.yml (run with test/e2e.sh): the real stack on
# fixture shows/music, with logs/covers/plays in throwaway volumes, nothing
# published to the host, and a Playwright container driving it.
services:
  init:
    # Override command: seed the covers volume with pre-extracted fixture art
    # (no caddy:/data in e2e, so the base chown for /data is dropped too).
    command:
      - sh
      - -c
      - |
        set -e
        cp -r /fixture-covers/. /covers/
        chown -R 10001:10001 /logs /covers /plays
        chmod -R u+rwX,g+rwX /logs /covers /plays
        chmod g+s /logs /covers /plays
    volumes:
      - e2e-logs:/logs
      - e2e-covers:/covers
      - e2e-plays:/plays
      - ./test/fixtures/covers:/fixture-covers:ro
  icecast:
    volumes:
      - e2e-logs:/var/log/icecast
      - ./test/fixtures/shows:/shows:ro
  liquidsoap:
    volumes:
      - ./test/fixtures/shows:/shows:ro
      - ./test/fixtures/music:/music:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays
  app:
    volumes:
      - ./test/fixtures/shows:/shows:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays:ro
  caddy:
    ports: !reset []
    volumes:
      - e2e-logs:/srv/logs
  e2e:
    image: radio-e2e
    build: { context: ., target: e2e }
    # Share Caddy's network namespace so the tests reach it as https://localhost,
    # the same site address (and local-CA certificate) as an unconfigured install.
    network_mode: service:caddy
    environment:
      BASE_URL: https://localhost
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_PASSWORD: ${SITE_PASSWORD}
    volumes:
      - ./test-results:/app/test-results
      - e2e-plays:/plays:ro
    depends_on:
      caddy: { condition: service_started }
      liquidsoap: { condition: service_started }

volumes:
  e2e-logs: {}
  e2e-covers: {}
  e2e-plays: {}
