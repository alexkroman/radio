# Node for the prettier hook (pinned for reproducibility).
default_language_version:
  node: 22.12.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]

  # GitHub Actions workflows: actionlint (syntax, expressions, shellcheck of
  # run: steps) and zizmor (security: permissions, injection, pinning...).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        # Offline: same results locally and in CI, no GitHub token needed.
        args: [--offline]

  - repo: local
    hooks:
      # TypeScript checks use the project's node_modules (npm ci first).
      - id: tsc
        name: tsc (type-check)
        language: system
        entry: npx tsc
        files: \.tsx?$
        pass_filenames: false

      - id: eslint
        name: eslint
        language: system
        entry: npx eslint --fix
        files: \.tsx?$

      - id: liquidsoap
        name: liquidsoap --check
        language: docker_image
        entry: savonet/liquidsoap:v2.3.3 --check
        files: \.liq$

      - id: caddy-fmt
        name: caddy fmt
        language: docker_image
        # Rewrites the file in place, like Prettier; re-stage and commit again.
        entry: caddy:2.11.9 caddy fmt --overwrite
        files: ^Caddyfile$

      - id: caddy-validate
        name: caddy validate
        language: docker_image
        # Root so validation can create the (throwaway) log directory.
        entry: --user 0:0 caddy:2.11.9 caddy adapt --validate --config
        files: ^Caddyfile$

      - id: compose
        name: docker compose config
        language: system
        entry: docker compose --env-file .env.example config -q
        files: ^(compose\.yml|\.env\.example)$
        pass_filenames: false
