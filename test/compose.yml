# End-to-end overlay for compose.yml (run with test/e2e.sh): the real stack on
# fixture shows/music, with shows/logs/covers/plays in throwaway volumes (shows
# so e2e.sh can add and remove one, as a deploy does), nothing
# published to the host, and a Playwright container driving it.
services:
  # Seeds the shows volume with the fixture shows and the covers volume with
  # pre-extracted fixture art, before init sets their owners as in production.
  # test/e2e.sh also runs it to add and remove a show.
  seed:
    image: busybox:1.38.0
    command:
      [
        "sh",
        "-c",
        "cp -r /fixture-shows/. /shows/ && chmod -R a+rX /shows && cp -r /fixture-covers/. /covers/",
      ]
    volumes:
      - e2e-shows:/shows
      - e2e-covers:/covers
      - ./test/fixtures/shows:/fixture-shows:ro
      - ./test/fixtures/covers:/fixture-covers:ro
  init:
    volumes:
      - e2e-logs:/logs
      - e2e-covers:/covers
      - e2e-plays:/plays
    depends_on:
      seed: { condition: service_completed_successfully }
  icecast:
    volumes:
      - e2e-logs:/var/log/icecast
      - e2e-shows:/shows:ro
  liquidsoap:
    volumes:
      - e2e-shows:/shows:ro
      - ./test/fixtures/music:/music:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays
  app:
    volumes:
      - e2e-shows:/shows:ro
      - e2e-covers:/covers:ro
      - e2e-plays:/plays:ro
  caddy:
    ports: !reset []
    volumes:
      - e2e-logs:/srv/logs
  e2e:
    image: radio-e2e
    build: { context: ., target: e2e }
    # Share Caddy's network namespace so the tests reach it as https://localhost,
    # the same site address (and local-CA certificate) as an unconfigured install.
    network_mode: service:caddy
    environment:
      BASE_URL: https://localhost
      SITE_PASSWORD: ${SITE_PASSWORD}
    volumes:
      - ./test-results:/app/test-results
      - e2e-plays:/plays:ro
    depends_on:
      caddy: { condition: service_started }
      liquidsoap: { condition: service_started }

volumes:
  e2e-shows: {}
  e2e-logs: {}
  e2e-covers: {}
  e2e-plays: {}
