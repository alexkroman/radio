# Beets config for Mazes Radio.
# Tags messy/untagged MP3s in-place using audio fingerprinting + MusicBrainz.
# Run: scripts/import.sh [show-slug]
#
# One-time setup:
#   brew install chromaprint pipx     # fpcalc fingerprinter + pipx
#   pipx install beets && pipx inject beets pyacoustid
#   pipx ensurepath                   # adds ~/.local/bin to PATH; restart shell
#
# If using Homebrew beets instead of pipx:
#   /opt/homebrew/opt/beets/libexec/bin/pip install pyacoustid

# Write ID3v2.4 (beets' default). v2.3 can't hold a full original release
# date or several genres/artists, so they were cut short on every write and
# `beet update` copied the cut-down tags back. Only beets, ffmpeg and
# Liquidsoap read these files, and they all read v2.4.
id3v23: no

directory: . # overridden per-show in import.sh with -d
library: ~/.config/beets/radio-library.db # overridden per-show in import.sh with -l

paths:
  default: "%if{$artist,$artist - }$title" # Artist - Title.mp3 (or just Title.mp3)
  singleton: "%if{$artist,$artist - }$title" # same flat format for singleton imports
  # Without this, compilation albums go to Compilations/<album>/<track> <title>,
  # a subfolder that cover extraction (and the duplicates report) don't see.
  comp: "%if{$artist,$artist - }$title"

# File names become cover URLs (covers/<show>/<stem>.jpg, encodeURI'd by the
# app), so keep "#" and "%" out of them as well as beets' defaults (setting
# `replace` drops the defaults, so they're repeated here).
replace:
  '[\\/]': _
  '^\.': _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  "[#%]": _
  '\.$': _
  '\s+$': ""
  '^\s+': ""
  "^-": _

import:
  copy: no # tag in-place; don't move files
  move: no
  write: yes
  timid: no # auto-accept matches above the confidence threshold
  # A show folder holds tracks from many albums, a few each: group them into
  # albums by their artist/album tags, so a match gets the release (album,
  # label, release ID for cover art), and fetchart works (it's per album).
  group_albums: yes
  # A new track from an album already in the library joins it; "skip" would
  # drop it as a duplicate album.
  duplicate_action: merge
  quiet_fallback: asis # import with existing tags when no MusicBrainz match found

# beets 2.x moved MusicBrainz into a plugin; listing plugins replaces the
# default list, so without it there are no candidates and every track is
# imported as-is.
plugins: musicbrainz chroma fromfilename fetchart embedart scrub mbsync duplicates

# beets 2.x penalizes a candidate from a different data source than the file's,
# and an untagged file has none, so every match lost ~11% and never reached
# the auto-accept threshold in quiet mode. MusicBrainz is the only source here,
# so the penalty means nothing. And a show has a track or two of each album,
# so don't count the rest of the album against a match.
# Artist names differ in form more than anything else ("Ryuichi Sakamoto" vs
# 坂本龍一, "A, B" vs "A + B", a co-artist missing), which held right albums at
# 72-82%; the album title, track titles, lengths and fingerprint already pin
# the release down. Wrong candidates score under 55%, so accept from 85% (the
# default is 96%). On 30 random Gloaming tracks: 29 matched, all correctly.
match:
  strong_rec_thresh: 0.15
  distance_weights:
    data_source: 0.0
    missing_tracks: 0.0
    artist: 1.0
  max_rec:
    missing_tracks: strong

chroma:
  auto: yes # fingerprint every track before MusicBrainz lookup

# Cover art, fetched for each album on import (needs Pillow: pipx inject beets
# pillow). Only art at least 1000 px wide replaces what a file already has;
# it's scaled to 1200 px (covers show at up to 512 px; lock screens and AirPlay
# larger). The Cover Art Archive (by release ID) comes first, at full
# resolution; the rest search by the album's artist and title.
fetchart:
  auto: yes
  minwidth: 1000
  maxwidth: 1200
  enforce_ratio: 10%
  high_resolution: yes
  sources:
    - coverart
    - itunes
    - amazon
    - albumart

# Embed the fetched art in every track of the album, then delete the image
# file, which would otherwise sit in the show's music folder.
embedart:
  auto: yes
  remove_art_file: yes

scrub:
  auto: yes # strip junk tags before writing clean ones


# Tags the app / Liquidsoap care about:
#   artist  → TPE1   artist  tag("artist", "")
#   title   → TIT2   title   tag("title", "")
#   album   → TALB   album   tag("album", "")
#   label   → TPUB   label   tag("label", "publisher")
#   isrc    → TSRC   isrc    tag("isrc", "tsrc")
# Beets writes all of these by default via its MusicBrainz lookup.
# mbsync re-syncs from MusicBrainz after import for more complete ISRC data.
